<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Glitz &amp; Glam custom water can concept</title>
  <desc id="description">A premium product mockup showing three black and gold Glitz &amp; Glam water cans, including still and sparkling water.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8dfd0"/>
      <stop offset=".55" stop-color="#c8b89d"/>
      <stop offset="1" stop-color="#96866f"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171612"/>
      <stop offset=".18" stop-color="#38332a"/>
